<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Mark Group -->
  <g transform="translate(0, 0)">
    <!-- Cybercore Frame (Pure Neutral) -->
    <rect x="2" y="2" width="60" height="60" rx="12" fill="#0A0A0A" stroke="#242424" stroke-width="2"/>
    <rect x="5" y="5" width="54" height="54" rx="9" fill="#050505" stroke="#333333" stroke-width="1" stroke-dasharray="4 2"/>
    
    <!-- Antenna / Hardware Pin Accents -->
    <line x1="20" y1="2" x2="20" y2="7" stroke="#E2F952" stroke-width="2" stroke-linecap="round"/>
    <line x1="44" y1="2" x2="44" y2="7" stroke="#E2F952" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="11" r="1.5" fill="#E2F952"/>
    <circle cx="44" cy="11" r="1.5" fill="#E2F952"/>
    
    <!-- Terminal Prompt Chevron & Cursor -->
    <path d="M18 24L30 34L18 44" stroke="#E2F952" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 44H46" stroke="#FAFAFA" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Micro Indicators -->
    <circle cx="50" cy="18" r="2" fill="#E2F952" opacity="0.9"/>
    <circle cx="44" cy="18" r="1.5" fill="#737373"/>
  </g>

  <!-- Typography -->
  <g transform="translate(76, 15)">
    <!-- Primary Brand Title -->
    <text x="0" y="18" fill="#FAFAFA" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="1.5">ANDROID CMD</text>
    <text x="134" y="18" fill="#E2F952" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="1.5">CHEATSHEET</text>
    
    <!-- Tagline / Subtitle -->
    <text x="0" y="34" fill="#A3A3A3" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.8">ADB &amp; FASTBOOT REFERENCE</text>
  </g>
</svg>
