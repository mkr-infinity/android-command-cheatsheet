name: Feature Request
description: Propose a new command, category, guide, or website improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Suggest an enhancement or new command for Android Command Cheatsheet!
  - type: input
    id: command_suggestion
    attributes:
      label: Suggested Command / Feature
      description: What command or functionality would you like to see?
      placeholder: e.g. adb pair wireless pairing guide, new fastboot partition command
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Description & Use Case
      description: Explain why this command or feature is helpful and provide example syntax if possible.
      placeholder: Detailed description...
    validations:
      required: true
